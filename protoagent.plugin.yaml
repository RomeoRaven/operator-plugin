id: operator_control
name: Operator Control
version: 0.5.0
min_protoagent_version: "0.131.3"
description: >-
  Read-only operator evidence for a small configured protoAgent fleet. The tool
  performs GET-only health and runtime-status reads concurrently, isolates target
  failures, and returns deterministic secret-free evidence for target readiness,
  version skew, and incomplete plugin configuration.
repository: https://github.com/RomeoRaven/operator-plugin
homepage: https://agent.protolabs.studio
enabled: false
requires_pip:
  - { pkg: "httpx>=0.27,<1", scope: host }
config_section: operator_control
config:
  targets: []
  target_tokens: ""
  timeout_seconds: 5
secrets: [target_tokens]
settings:
  - { key: targets, label: "Fleet targets", type: string_list, description: "One id=https://host entry per target. Target selection remains operator-controlled." }
  - { key: target_tokens, label: "Target token map", type: secret, description: "Optional JSON object mapping target IDs to bearer tokens. Stored through the host secret path and never returned." }
  - { key: timeout_seconds, label: "Read timeout (seconds)", type: number, description: "Per-client timeout, clamped to 1–30 seconds." }
capabilities:
  network: ["*"]
  filesystem: none
