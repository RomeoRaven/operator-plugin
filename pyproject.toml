[project]
name = "protoagent-operator-control"
version = "0.4.0"
description = "Read-only normalized fleet evidence for version skew and incomplete plugins."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
